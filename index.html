body{margin:0;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:var(--ink);background:#ff2d95 linear-gradient(135deg,#ff2d95,#ff9a00,#ffe600,#00e5a8,#00b4ff,#8a2be2,#ff2d95);background-size:400% 400%;animation:bg 18s ease infinite;min-height:100vh;overflow-x:hidden}

<script id="data" type="application/json">{"posts":[{"id":"muwhoyxc","title":"selected in INSPIRE AWARDS state level competition SLEPC","text":"My INSPIRE-MANAK Journey\n\nINSPIRE Awards–MANAK (Million Minds Augmenting National Aspirations and Knowledge) is a flagship initiative of the Department of Science & Technology (DST), Government of India, implemented with the National Innovation Foundation (NIF–India). It encourages school students to transform their creative ideas into innovative, science- and technology-based solutions for real-world problems.\n\nThe programme begins with the identification of innovative student ideas from across India. From a national target of one million ideas, around one lakh ideas are shortlisted for the initial ₹10,000 INSPIRE Award, which supports students in developing their ideas into models or prototypes. The selected projects then progress through the District Level (DLEPC), State Level (SLEPC), and National Level (NLEPC) stages.\n\nMy Achievement\n\nMy INSPIRE-MANAK journey has been a remarkable part of my growth as a young innovator. I have received the ₹10,000 INSPIRE Award for three consecutive years, giving me the opportunity to explore my ideas, build projects and strengthen my skills in scientific thinking and problem-solving.\n\nThis year, I took another significant step forward by being selected for the State Level Exhibition & Project Competition (SLEPC) with my project “Smart Street Light System.”\n\nBeing selected at the State Level is a proud milestone in my journey. It reflects my continued effort to identify real-world problems, think creatively, and turn ideas into practical technological solutions.\n\nFor me, INSPIRE-MANAK is more than a competition—it has been a platform to learn, experiment, innovate and grow as a student, inspiring me to continue exploring science and technology and create solutions that can make a meaningful difference.","tag":"🥇 Competition","img":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQ <script>
const $=s=>document.querySelector(s);
const TAGS=["🏆 Award","🥇 Competition","📚 Academics","🎨 Creative","⚽ Sports","🚀 Project","🎤 Event","📜 Certificate"];
let state=JSON.parse($('#data').textContent);const admin=location.hash==='#admin';
function mk(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
document.querySelectorAll('.mq div').forEach(d=>{const s=TAGS.concat(["✨ Bhargava Taman ✨"]).join("   ★   ")+"   ★   ";d.textContent=s+s+s+s});
function renderPosts(){const f=$('#feed');f.textContent='';const ps=state.posts.slice().sort((a,b)=>b.ts-a.ts);
if(!ps.length){f.append(mk('div','card empty','🌈 Achievements are on the way — check back soon!'));return}
ps.forEach((p,i)=>{const c=mk('article','card c'+(i%4));
const top=mk('div','top');top.append(mk('span','chip',p.tag||'🏆 Award'),mk('span','date',new Date(p.ts).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'})));c.append(top);
if(p.img){const im=new Image();im.src=p.img;im.alt=p.title||'Achievement photo';c.append(im)}
c.append(mk('h2',0,p.title||''),mk('p','cap',p.text||''));
if(admin){const d=mk('button','del','🗑 Delete');let armed=0;d.onclick=()=>{if(!armed){armed=1;d.textContent='Tap again to delete';setTimeout(()=>{armed=0;d.textContent='🗑 Delete'},3000);return}state.posts=state.posts.filter(x=>x.id!==p.id);renderPosts();$('#dl').hidden=false};c.append(d)}
f.append(c)})}
function build(){const c=document.documentElement.cloneNode(true);c.querySelector('#feed').textContent='';c.querySelectorAll('.mq div').forEach(d=>d.textContent='');c.querySelector('#tag').textContent='';c.querySelector('#composer').hidden=true;c.querySelector('#dl').hidden=true;c.querySelector('#data').textContent=JSON.stringify(state).replace(/</g,'\\u003c');return '<!DOCTYPE html>\n'+c.outerHTML}
function shrink(f){return new Promise((ok,no)=>{const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const k=Math.min(1,1100/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',.8))};im.onerror=no;im.src=u})}
function setupComposer(){$('#composer').hidden=false;const sel=$('#tag');TAGS.forEach(t=>sel.append(new Option(t,t)));
$('#post').onclick=async()=>{const title=$('#title').value.trim(),text=$('#text').value.trim(),f=$('#photo').files[0],b=$('#post');if(!title&&!text&&!f)return;b.disabled=true;
